[package]
name = "note-quick-copy"
version = "1.0.0"
description = "Note Quick Copy - ghi chú nhanh, copy 1 click, mã hóa at-rest"
edition = "2021"

[lib]
name = "note_quick_copy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "2"
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
